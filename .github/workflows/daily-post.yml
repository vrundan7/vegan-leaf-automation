name: Daily Instagram post

on:
  schedule:
    # ── Posting slots (Europe/Berlin; GitHub handles CET/CEST). ─────────────────────
    # How many posts per day = repo variable POSTS_PER_DAY (default 1).
    # Have at least as many slots below as POSTS_PER_DAY. Each slot has a backup 45 min
    # later that only posts if its slot was delayed or dropped (MIN_HOURS_BETWEEN_POSTS).
    # Uncomment a pair to add a slot.
    #
    # - cron: "0 9 * * *"           # morning slot
    #   timezone: "Europe/Berlin"
    # - cron: "45 9 * * *"
    #   timezone: "Europe/Berlin"
    #
    # - cron: "0 13 * * *"          # lunch slot
    #   timezone: "Europe/Berlin"
    # - cron: "45 13 * * *"
    #   timezone: "Europe/Berlin"
    #
    - cron: "0 18 * * *"            # evening slot (default)
      timezone: "Europe/Berlin"
    - cron: "45 18 * * *"           # backup for the evening slot
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run renders only; check tests credentials; publish posts for real (needs PUBLISH_ENABLED=true)"
        type: choice
        options: [dry-run, check, publish]
        default: dry-run

permissions: {}  # every job opts in to the minimum it needs

concurrency:
  group: instagram-publisher       # one publisher at a time, queued, never cancelled mid-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate content library
        run: python -m src.generate_post --validate
      - name: Run test suite
        run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write     # commit state/state.json
      pages: write        # deploy today's image to GitHub Pages
      id-token: write     # required by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}   # always the newest state file

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$PUBLISH_ENABLED" = "true" ]; then MODE=publish
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "publish" ]; then MODE=publish
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_MODE" = "check" ]; then MODE=check
          else MODE=dry-run; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running in $MODE mode (event=$EVENT, PUBLISH_ENABLED=${PUBLISH_ENABLED:-unset})"

      - name: Dry run (no deploy, no posting)
        if: steps.mode.outputs.mode == 'dry-run'
        env:
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
          MIN_HOURS_BETWEEN_POSTS: ${{ vars.MIN_HOURS_BETWEEN_POSTS || '2' }}
        run: python -m src.generate_post --dry-run

      - name: Check credentials (no posting)
        if: steps.mode.outputs.mode == 'check'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v21.0' }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: python -m src.generate_post --check

      - name: Configure GitHub Pages
        id: pages
        if: steps.mode.outputs.mode == 'publish'
        uses: actions/configure-pages@v6

      - name: Select post, render graphic, build site
        id: build
        if: steps.mode.outputs.mode == 'publish'
        env:
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
          MIN_HOURS_BETWEEN_POSTS: ${{ vars.MIN_HOURS_BETWEEN_POSTS || '2' }}
        run: python -m src.generate_post --build

      - name: Upload Pages artifact
        if: steps.mode.outputs.mode == 'publish' && steps.build.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.mode.outputs.mode == 'publish' && steps.build.outputs.skip == 'false'
        uses: actions/deploy-pages@v5

      - name: Publish to Instagram
        if: steps.mode.outputs.mode == 'publish' && steps.build.outputs.skip == 'false'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v21.0' }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          MAX_CAPTION_HASHTAGS: ${{ vars.MAX_CAPTION_HASHTAGS || '5' }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '1' }}
          MIN_HOURS_BETWEEN_POSTS: ${{ vars.MIN_HOURS_BETWEEN_POSTS || '2' }}
        run: python -m src.generate_post --publish

      - name: Commit publication history
        if: always() && steps.mode.outputs.mode == 'publish' && steps.build.outputs.skip == 'false'
        run: |
          if git diff --quiet -- state/state.json; then
            echo "State unchanged; nothing to commit."; exit 0
          fi
          git config user.name  "vegan-leaf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "state: record post for $(TZ=Europe/Berlin date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            echo "push attempt $i failed; retrying"; sleep $((i * 5))
          done
          echo "::error::Could not push state. The next run will reconcile via the recent-media check."
          exit 1

      - name: Upload rendered graphic for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-post
          path: out/
          if-no-files-found: ignore
          retention-days: 14
